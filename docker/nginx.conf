# --- CONFIGURACIÓN COMPLETA Y CORRECTA PARA NGINX ---

# Configuración de eventos (necesaria para que Nginx inicie)
events {
    worker_connections 1024;
}

# Configuración del protocolo HTTP
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Nuestro bloque de servidor va DENTRO de la sección http
    server {
        # Le decimos a Nginx que escuche en el puerto que Render le asigne dinámicamente.
        listen ${PORT};
        
        server_name localhost;
        root /var/www/html/public;

        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            # Conectar con PHP-FPM
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        error_log  /var/log/nginx/error.log;
        access_log /var/log/nginx/access.log;
    }
}